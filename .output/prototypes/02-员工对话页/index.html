<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02-员工对话页 · 智能办公助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #C11920;
      --primary-hover: #A01418;
      --accent: #F6AB00;
      --accent-light: #FFCF33;
      --secondary: #D84C14;
      --success: #48B794;
      --bg: #F1F4F6;
      --surface: #FFFFFF;
      --text: #333333;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border: #D5D7DB;
      --user-bubble-bg: #FDF2F2;
      --user-bubble-border: #F5C6C6;
      --radius: 8px;
      --gradient-brand: linear-gradient(to right, #FFCF33 50%, #C11920);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #e8e8ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .viewport-label {
      position: fixed;
      top: 12px;
      left: 12px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface);
      padding: 4px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      z-index: 10;
    }

    .screen {
      width: 1440px;
      height: 900px;
      max-width: 100%;
      display: flex;
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      background: var(--surface);
    }

    /* 左栏 */
    .sidebar-left {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .btn-new {
      width: 100%;
      height: 40px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-new:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .session-item {
      position: relative;
      padding: 12px 12px 12px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
    }

    .session-item:hover { background: var(--bg); }

    .session-item.active {
      background: #FDF2F2;
    }

    .session-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 2px 2px 0;
    }

    .session-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .session-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .tag-active {
      background: #FEF3C7;
      color: #92400E;
    }

    .tag-ended {
      background: var(--bg);
      color: var(--text-muted);
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    .btn-end {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    .btn-end:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 中栏 */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .topbar {
      background: var(--surface);
      position: relative;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
    }

    .product-name {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-link {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      background: none;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s, background 0.15s;
    }

    .topbar-link:hover {
      color: var(--accent);
      background: rgba(246, 171, 0, 0.08);
    }

    .topbar-link.admin {
      color: var(--primary);
      border: 1px solid #F5C6C6;
      background: #FDF2F2;
    }

    .brand-line {
      height: 2px;
      background: var(--gradient-brand);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message-row {
      display: flex;
      max-width: 78%;
    }

    .message-row.user {
      align-self: flex-end;
      justify-content: flex-end;
    }

    .message-row.assistant {
      align-self: flex-start;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid var(--border);
    }

    .bubble.user {
      background: var(--user-bubble-bg);
      border-color: var(--user-bubble-border);
    }

    .bubble.assistant {
      background: var(--surface);
    }

    .task-card {
      margin-top: 12px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .task-card:hover { border-color: var(--primary); }

    .task-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .task-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .task-card-progress {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 50%;
      background: var(--primary);
      border-radius: 2px;
    }

    .task-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .input-area {
      padding: 16px 24px 24px;
      background: var(--bg);
    }

    .input-box {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }

    .input-box textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      min-height: 44px;
      color: var(--text);
      background: transparent;
    }

    .input-box textarea::placeholder { color: var(--text-muted); }

    .btn-send {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-send:hover { background: var(--accent); }

    .btn-send svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="viewport-label">1440 × 900 · 02-员工对话页原型</div>

  <div class="screen" role="main">
    <aside class="sidebar-left">
      <div class="sidebar-header">
        <button type="button" class="btn-new">+ 新建对话</button>
      </div>
      <div class="session-list">
        <div class="session-item active">
          <div class="session-title">神东出差安排</div>
          <div class="session-meta">
            <span class="session-time">今天 14:32</span>
            <span class="tag tag-active">进行中</span>
          </div>
        </div>
        <div class="session-item">
          <div class="session-title">鄂尔多斯住宿费标准</div>
          <div class="session-meta">
            <span class="session-time">昨天 10:15</span>
            <span class="tag tag-ended">已结束</span>
          </div>
        </div>
        <div class="session-item">
          <div class="session-title">本周工包填报</div>
          <div class="session-meta">
            <span class="session-time">3月20日</span>
            <span class="tag tag-ended">已结束</span>
          </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <button type="button" class="btn-end">结束当前会话</button>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="product-name">智能办公助手</div>
          <nav class="topbar-actions">
            <button type="button" class="topbar-link">知识库帮助</button>
            <button type="button" class="topbar-link">人工协助</button>
            <button type="button" class="topbar-link">清除记忆</button>
            <button type="button" class="topbar-link">设置</button>
            <button type="button" class="topbar-link admin">管理员入口</button>
          </nav>
        </div>
        <div class="brand-line" aria-hidden="true"></div>
      </header>

      <div class="messages">
        <div class="message-row user">
          <div class="bubble user">下周三去神东项目出差，帮我安排差旅申请和机票</div>
        </div>

        <div class="message-row assistant">
          <div class="bubble assistant">
            好的，我已开始为您安排。请先确认以下信息…
            <div class="task-card">
              <div class="task-card-header">
                <span class="task-card-title">神东出差差旅安排</span>
                <span class="task-card-progress">2/4 步骤</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill"></div>
              </div>
              <div class="task-card-desc">差旅申请创建 · 机票预订 · 酒店预订 · 用户确认</div>
            </div>
          </div>
        </div>

        <div class="message-row user">
          <div class="bubble user">经济舱即可，需要订酒店</div>
        </div>

        <div class="message-row assistant">
          <div class="bubble assistant">
            已记录您的偏好。差旅申请已提交（单号 TA20260325001），正在查询机票…
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea rows="1" placeholder="输入办公指令，如：帮我写邮件…"></textarea>
          <button type="button" class="btn-send" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
